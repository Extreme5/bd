{% extends "base.html" %}
{% block content %}

<br>
<center>
<div class="card">
    <div class="card-body text-center">
      <h5 class="card-title">Ajouter une série</h5>
      <form method = "post" name = "new_serie">
        {% csrf_token %}
        <div class="mb-3">
          <input type="text" class="form-control" style="display:block; margin-bottom:7px" name="serie_name" placeholder="Nom de la série" required>
          <input type="text" class="form-control" name="total" placeholder="Nombre total d'albums dans la série" required>
        </div>
        <button type="submit" class="btn btn-outline-primary rounded-pill px-4">
          Ajouter
        </button>
    </div>
</div>
</center>

<script>
  // popup helper
  function showPopup(message, duration = 1800) {
    const el = document.createElement('div');
    el.className = 'mini-popup';
    el.textContent = message;
    document.body.appendChild(el);
    // commencer la disparition après `duration` ms
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.4s'; }, duration);
    setTimeout(() => el.remove(), duration + 400);
  }
  // show messages (one-time) as popups
  document.addEventListener('DOMContentLoaded', () => {
    {% if messages %}
      {% for message in messages %}
        (function() {
          const text = "{{ message|escapejs }}";
          const tags = "{{ message.tags|escapejs }}"; // contient les extra tags (ex: "success long")
          const isLong = tags.split(' ').indexOf('long') !== -1;
          const duration = isLong ? 5000 : 1800; // 5s pour 'long', sinon ~1.8s
          showPopup(text, duration);
        })();
      {% endfor %}
    {% endif %}
  });
</script>

{% endblock %}
